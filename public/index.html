      :'<button data-b="'+k+'" class="buy" '+(FRAG<it.p?'disabled':'')+'>✦ '+it.p+'</button>'+(tab==='skins'?'<button data-p="'+k+'" style="padding:5px 8px">Prévia</button>':''))+'</div>'}).join('')+
 (tab==='runas'?'<div class="pdim" style="margin-top:8px">A runa equipada dura uma jornada (vencer ou perder consome).</div>':'<div class="pdim" style="margin-top:8px">A skin tinge o corpo das torres 3D.</div>'));
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>renderLoja(b.dataset.t));
 document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const k=b.dataset.b;
  if(tab==='runas'){if(OWN.runas.includes(k)||FRAG<RUNAS[k].p)return;FRAG-=RUNAS[k].p;OWN.runas.push(k)}
  else{if(OWN.skins.includes(k)||FRAG<SKINS[k].p)return;FRAG-=SKINS[k].p;OWN.skins.push(k)}
  persistMeta();renderLoja(tab)});
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=b.dataset.u;
  if(tab==='runas')EQ=EQ===k?null:k;else{SKIN=SKIN===k?null:k;pvK=k;if(pv)pvShow(k)}persistMeta();renderLoja(tab)});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pvShow(b.dataset.p));
 if(tab==='skins')pvShow(pvK||SKIN||'ouro');else pvStop()}
if(location.hash.indexOf('#ses=')===0){const p=location.hash.slice(5).split(',');
 SES={t:p[0],name:decodeURIComponent(p[1]||'Guardião')};saveSes();history.replaceState(null,'',location.pathname)}
document.getElementById('auIn').onclick=()=>doAuth('login');
document.getElementById('auGh').onclick=()=>location.href='/api/oauth/github';
document.getElementById('auGl').onclick=()=>location.href='/api/oauth/google';
document.getElementById('auSkip').onclick=()=>{SES=null;saveSes();enterApp()};
document.getElementById('auUp').onclick=()=>doAuth('register');
document.getElementById('auPass').addEventListener('keydown',e=>{if(e.key==='Enter')doAuth('login')});
document.getElementById('mOut').onclick=()=>{if(SES){SES=null;saveSes()}showAuth()};
if(SES)enterApp();else showAuth();
function showAuth(){document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='none';document.getElementById('tbar').style.display='none';const a=document.getElementById('auth');a.style.display='flex';
 document.getElementById('auMsg').textContent='';setTimeout(()=>document.getElementById('auName').focus(),0)}
addEventListener('pointerdown',aud,{once:true});
</script>
